<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerAccred Car Wash</title>
    <!-- Load scripts with crossorigin for better hosting compatibility -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes brushSpinVertical { 0% { transform: scaleX(1); } 25% { transform: scaleX(0.05); } 50% { transform: scaleX(1); } 75% { transform: scaleX(0.05); } 100% { transform: scaleX(1); } }
        @keyframes fullWaterfall { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        @keyframes bubbleFloat { 0%, 100% { transform: translateY(0) translateX(0); } 50% { transform: translateY(-20px) translateX(10px); } }
        @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); } 50% { opacity: 1; transform: scale(1.2) rotate(180deg); } }
        @keyframes jitter { 0% { transform: translateX(-50%) translate(0, 0); } 10% { transform: translateX(-50%) translate(-2px, -2px); } 20% { transform: translateX(-50%) translate(2px, 2px); } 100% { transform: translateX(-50%) translate(0, 0); } }
        @keyframes bounce { 0%, 100% { transform: translateX(-50%) translateY(0) scale(1.1); } 50% { transform: translateX(-50%) translateY(-10px) scale(1.1); } }
        @keyframes marqueePulse { 
            0%, 100% { text-shadow: 0 0 10px rgba(25, 111, 179, 0.5); color: white; } 
            50% { text-shadow: 0 0 20px rgba(25, 111, 179, 1); color: #bfdbfe; } 
        }
        .animate-twinkle { animation: twinkle 1.5s infinite ease-in-out; }
        .animate-jitter { animation: jitter 0.2s infinite linear; }
        .animate-bounce { animation: bounce 0.6s infinite ease-in-out; }
        .animate-marquee-text { animation: marqueePulse 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        
        // --- SVG COMPONENTS ---
        const PowerButtonIcon = () => (
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#196fb3" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" className="animate-pulse">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
                <line x1="12" y1="2" x2="12" y2="12" />
            </svg>
        );

        const RotateCcw = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
            </svg>
        );

        const Play = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
        );

        const MusicIcon = ({ active }) => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={active ? "text-emerald-500 animate-bounce" : "text-slate-300"}>
                <path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" />
            </svg>
        );

        const Smile = ({ className }) => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
            </svg>
        );

        const Frown = ({ className }) => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
            </svg>
        );

        const Star = ({ size }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
        );

        const App = () => {
            const [progress, setProgress] = useState(0);
            const [isDragging, setIsDragging] = useState(false);
            const [isAutomating, setIsAutomating] = useState(false);
            const [showSparkles, setShowSparkles] = useState(false);
            const trackRef = useRef(null);
            
            const audioCtxRef = useRef(null);
            const melodyTimeoutRef = useRef(null);

            // --- REFINED IMAGE LINKS ---
            // Using lh3.googleusercontent.com/d/[ID] format for maximum stability
            const rustedImg = "https://lh3.googleusercontent.com/d/1yPL_3ymGeOvoXzECwC8psNnwvT8e-03G";
            const restoredImg = "https://lh3.googleusercontent.com/d/1mLtjbjGBxbJeoxFbdgltRPKxiLWmaMYC";

            const playElevatorMusic = () => {
                if (!audioCtxRef.current) {
                    audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                }
                const ctx = audioCtxRef.current;
                if (ctx.state === 'suspended') ctx.resume();

                const notes = [261.63, 329.63, 392.00, 440.00, 523.25];
                let noteIndex = 0;

                const scheduleNote = () => {
                    if (!isAutomating) return;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[noteIndex % notes.length], ctx.currentTime);
                    gain.gain.setValueAtTime(0.06, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.6);
                    noteIndex++;
                    melodyTimeoutRef.current = setTimeout(scheduleNote, 450);
                };
                scheduleNote();
            };

            const stopElevatorMusic = () => {
                if (melodyTimeoutRef.current) clearTimeout(melodyTimeoutRef.current);
            };

            useEffect(() => {
                if (isAutomating) playElevatorMusic();
                else stopElevatorMusic();
                return () => stopElevatorMusic();
            }, [isAutomating]);

            useEffect(() => {
                let interval;
                if (isAutomating) {
                    interval = setInterval(() => {
                        setProgress(prev => {
                            if (prev >= 100) { setIsAutomating(false); return 100; }
                            return prev + 0.32; 
                        });
                    }, 16);
                }
                return () => clearInterval(interval);
            }, [isAutomating]);

            const handleMove = (clientX) => {
                if (!isDragging || isAutomating || !trackRef.current) return;
                const rect = trackRef.current.getBoundingClientRect();
                const x = clientX - rect.left;
                const newProgress = Math.max(0, Math.min(100, (x / rect.width) * 100));
                setProgress(newProgress);
            };

            useEffect(() => {
                const onMouseMove = (e) => handleMove(e.clientX);
                const onTouchMove = (e) => handleMove(e.touches[0].clientX);
                const onEnd = () => setIsDragging(false);
                if (isDragging) {
                    window.addEventListener('mousemove', onMouseMove);
                    window.addEventListener('touchmove', onTouchMove);
                    window.addEventListener('mouseup', onEnd);
                    window.addEventListener('touchend', onEnd);
                }
                return () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('touchmove', onTouchMove);
                    window.removeEventListener('mouseup', onEnd);
                    window.removeEventListener('touchend', onEnd);
                };
            }, [isDragging]);

            useEffect(() => { setShowSparkles(progress > 85); }, [progress]);

            const getTransitionProgress = () => {
                const start = 35, end = 65;
                if (progress < start) return 0;
                if (progress > end) return 100;
                return ((progress - start) / (end - start)) * 100;
            };

            const transitionVal = getTransitionProgress();
            const isInWash = progress >= 32 && progress <= 68;
            const blingPositions = [{t:'20%',l:'30%'},{t:'40%',l:'70%'},{t:'15%',l:'50%'},{t:'60%',l:'20%'},{t:'55%',l:'80%'}];

            return (
                <div className="min-h-screen bg-white flex flex-col items-center justify-center p-4 md:p-8 font-sans select-none overflow-hidden">
                    {/* Header */}
                    <div className="max-w-5xl w-full mb-8 flex justify-between items-end px-4">
                        <div>
                            <h1 className="text-2xl md:text-3xl font-black text-slate-900 flex items-center gap-3 italic tracking-tighter uppercase">
                                <PowerButtonIcon /> PowerAccred Car Wash
                            </h1>
                            <p className="text-slate-400 font-semibold text-[10px] tracking-[0.2em] uppercase">High-Pressure Restoration & Morale Boost</p>
                        </div>
                        <div className="flex gap-2">
                            <button 
                                onClick={() => { setProgress(0); setIsAutomating(true); }} 
                                disabled={isAutomating}
                                className={`flex items-center gap-2 px-4 md:px-6 py-2 rounded-full font-bold text-xs md:text-sm transition-all shadow-sm ${isAutomating ? 'bg-blue-50 text-blue-400' : 'text-white hover:bg-[#155a92] active:scale-95'}`}
                                style={{ backgroundColor: isAutomating ? undefined : '#196fb3' }}
                            >
                                <Play /> {isAutomating ? 'WASHING...' : (progress > 0 && progress < 100 ? 'RESUME' : 'START WASH')}
                            </button>
                            <button onClick={() => { setProgress(0); setIsAutomating(false); }} className="flex items-center gap-2 px-4 py-2 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-full border border-slate-200 font-bold text-xs md:text-sm active:scale-95">
                                <RotateCcw /> RESET
                            </button>
                        </div>
                    </div>

                    {/* Main Track */}
                    <div ref={trackRef} className="max-w-6xl w-full aspect-[21/9] relative bg-slate-50 rounded-[2rem] md:rounded-[4rem] border-[8px] md:border-[16px] border-white shadow-[0_20px_50px_rgba(0,0,0,0.05)] overflow-hidden">
                        
                        <div 
                            className="absolute top-1/2 -translate-y-1/2 w-[30%] aspect-video z-10 transition-all duration-75 cursor-grab active:cursor-grabbing" 
                            style={{ left: `calc(${progress}% - ${progress * 0.30}%)` }}
                            onMouseDown={() => { setIsDragging(true); setIsAutomating(false); }}
                            onTouchStart={() => { setIsDragging(true); setIsAutomating(false); }}
                        >
                            <div className="relative w-full h-full pointer-events-none">
                                <div className={`absolute -top-20 md:-top-24 left-1/2 -translate-x-1/2 z-30 transition-all duration-500 ${transitionVal < 5 ? 'animate-jitter' : ''}`} style={{ opacity: transitionVal < 5 ? 1 : 0, transform: `translateX(-50%) scale(${transitionVal < 5 ? 1 : 0.5})` }}>
                                    <svg width="100" height="80" viewBox="0 0 120 100"><path d="M10,40 L30,10 L60,0 L90,10 L110,40 L90,70 L60,85 L30,70 Z" fill="white" stroke="#ef4444" strokeWidth="3" /><path d="M35,45 C30,30 45,20 60,35 C75,50 45,70 30,55 C15,40 50,25 75,40 C100,55 60,75 40,65" fill="none" stroke="black" strokeWidth="2.5" /></svg>
                                </div>
                                <div className={`absolute -top-24 md:-top-28 left-1/2 -translate-x-1/2 z-30 transition-all duration-500 ${transitionVal > 95 ? 'animate-bounce' : ''}`} style={{ opacity: transitionVal > 95 ? 1 : 0, transform: `translateX(-50%) scale(${transitionVal > 95 ? 1.1 : 0.5})` }}>
                                    <svg width="120" height="100" viewBox="0 0 140 110"><path d="M10,50 L30,40 L25,20 L50,30 L60,5 L75,30 L100,20 L95,45 L120,55 L95,65 L105,90 L75,80 L60,105 L45,80 L15,90 L25,65 Z" fill="white" stroke="#10b981" strokeWidth="3" /><text x="50%" y="55%" textAnchor="middle" fill="#065f46" style={{ fontSize: '18px', fontWeight: 900 }}>OH YEAH!!</text></svg>
                                </div>
                                <img 
                                    src={restoredImg} 
                                    className="absolute inset-0 w-full h-full object-contain" 
                                    style={{ clipPath: `inset(0 0 0 ${100 - transitionVal}%)` }}
                                    onError={(e) => { e.target.style.display = 'none'; }}
                                />
                                <img 
                                    src={rustedImg} 
                                    className="absolute inset-0 w-full h-full object-contain" 
                                    style={{ clipPath: `inset(0 ${transitionVal}% 0 0)` }}
                                    onError={(e) => { e.target.style.display = 'none'; }}
                                />
                                {showSparkles && blingPositions.map((pos, i) => (
                                    <div key={i} className="absolute animate-twinkle text-yellow-400" style={{ top: pos.t, left: pos.l, animationDelay: `${i*0.4}s` }}><Star size={20} /></div>
                                ))}
                            </div>
                        </div>

                        {/* Tunnel Structure */}
                        <div className="absolute top-0 bottom-0 left-[35%] right-[35%] z-20 pointer-events-none">
                            <div className="absolute inset-0 bg-blue-500/5 backdrop-blur-[10px] border-x-[10px] md:border-x-[20px] border-white shadow-[inset_0_0_100px_rgba(25,111,179,0.2)]">
                                
                                <div className="absolute top-0 left-0 right-0 h-16 md:h-24 bg-slate-900 border-b-8 flex flex-col items-center justify-center shadow-2xl" style={{ borderColor: '#196fb3' }}>
                                    <div className="absolute bottom-2 left-0 right-0 flex justify-between px-4 md:px-8">
                                        {[...Array(6)].map((_, i) => (
                                            <div key={i} className="w-1 md:w-1.5 h-1 md:h-1.5 rounded-full animate-pulse shadow-[0_0_8px_#196fb3]" style={{ backgroundColor: '#196fb3', animationDelay: `${i*0.3}s` }} />
                                        ))}
                                    </div>
                                    <div className="flex flex-col items-center text-center px-4 w-full">
                                        <span className="text-white text-[9px] md:text-[11px] font-black tracking-[0.1em] md:tracking-[0.2em] uppercase animate-marquee-text italic block w-full">
                                            Resetting features and mood!
                                        </span>
                                        <div className="mt-1 flex items-center justify-center gap-2">
                                            <div className={`w-1.5 h-1.5 rounded-full ${isInWash ? 'bg-emerald-400 animate-ping' : 'bg-slate-700'}`} />
                                            <span className="text-[7px] md:text-[8px] text-slate-500 font-bold uppercase tracking-widest flex items-center gap-1">
                                                {isInWash ? <><MusicIcon active={true} /> Processing</> : 'Ready'}
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                <div className="absolute inset-0 overflow-hidden mix-blend-multiply opacity-30">
                                    {[...Array(20)].map((_, i) => <div key={i} className="absolute top-0 w-[4px] bg-blue-400 rounded-full blur-[1px]" style={{ left: `${i*5}%`, height:'100%', animation: `fullWaterfall 0.5s infinite linear`, animationDelay: `${i*0.1}s` }} />)}
                                </div>
                                <div className={`absolute inset-0 transition-opacity duration-500 ${isInWash ? 'opacity-100' : 'opacity-10'}`}>
                                    {[...Array(40)].map((_, i) => <div key={i} className="absolute bg-white/80 rounded-full blur-[15px] animate-pulse" style={{ width: '60px', height:'60px', top: `${Math.random()*100}%`, left: `${Math.random()*100}%` }} />)}
                                </div>
                                <div className="absolute inset-0 flex justify-around items-center px-4 py-20 md:py-24 opacity-40">
                                    {[...Array(3)].map((_, i) => <div key={i} className="h-full w-12 md:w-20 relative" style={{ animation: 'brushSpinVertical 0.6s infinite linear' }}>
                                        {[...Array(8)].map((_, j) => <div key={j} className="absolute w-full h-3 md:h-4 bg-yellow-400 rounded-full blur-[1px]" style={{ top: `${j*12}%`, transform: `rotate(${j*45}deg) scaleX(1.1)` }} />)}
                                    </div>)}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Dashboard */}
                    <div className="max-w-2xl w-full mt-6 md:mt-10 bg-slate-50 border border-slate-100 p-6 md:p-8 rounded-[2rem] md:rounded-[3rem] shadow-sm text-center">
                        <div className="flex justify-between items-center mb-6">
                            <div className="flex items-center gap-3 text-left">
                                <div className={`p-3 rounded-2xl transition-all ${isInWash ? 'text-white shadow-lg' : 'bg-white text-slate-400 border border-slate-100'}`} style={{ backgroundColor: isInWash ? '#196fb3' : undefined }}>
                                    {transitionVal < 50 ? <Frown /> : <Smile className="text-white" />}
                                </div>
                                <span className="text-slate-900 text-[10px] font-black uppercase tracking-widest hidden sm:block">Condition Status</span>
                            </div>
                            <div className="flex flex-col items-end">
                                <span className="text-3xl md:text-4xl font-black font-mono text-slate-900 leading-none">{Math.round(progress)}%</span>
                                {isAutomating && <span className="text-[8px] md:text-[10px] text-emerald-500 font-bold uppercase tracking-widest mt-1 animate-pulse">Playing: Wash Mood</span>}
                            </div>
                        </div>
                        <div className="w-full h-6 md:h-8 bg-white border border-slate-100 rounded-full p-1.5 md:p-2 shadow-inner">
                            <div className="h-full rounded-full transition-all duration-300 shadow-sm" style={{ width: `${progress}%`, backgroundColor: '#196fb3' }} />
                        </div>
                    </div>
                </div>
            );
        };

        window.addEventListener('load', () => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        });
    </script>
</body>
</html>
